name: CI

# The trust gate: type-check + the full red-team suite on every push and PR, so
# main cannot silently go red again. Runs on macOS to match the development
# environment where all 144 tests are green: macOS runners ship Swift/Xcode, so
# the Swift lanes run for real. (Stock-Linux Swift cannot run the ssrf-swift /
# sql-injection-swift lanes — they need Swift's libcurl networking + SQLite
# backends — so those went lane-dead on ubuntu.) Node/Python/Go/.NET are
# provisioned below; every lane executes for real.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Swift is pre-installed on macOS runners (Xcode) — no setup step needed.

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Red-team suite
        run: npm test
