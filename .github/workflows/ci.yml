name: CI

# The trust gate: type-check + the full red-team suite on every push and PR, so
# main cannot silently go red again. Cross-language lanes that need .NET / Swift
# skip gracefully when those toolchains are absent (see skipNo* guards in the
# suite); Node / Python / Go are provisioned here so their lanes run for real.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Red-team suite
        run: npm test
